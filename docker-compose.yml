# docker-compose.yml (simplificado — só dev local)

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: launchkit
      POSTGRES_PASSWORD: launchkit
      POSTGRES_DB: launchkit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: